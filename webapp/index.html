<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Дневник тренировок</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #0b0b0f;
      --muted: #5c5c62;
      --accent: #007aff;
      --danger: #d70015;
      --border: #e5e5ea;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --radius: 14px;
      --toast-bg: rgba(0,0,0,0.85);
      --toast-text: #fff;
    }
    [data-theme="dark"] {
      --bg: #0f1115;
      --card: #181b22;
      --text: #f5f7ff;
      --muted: #9ba0ad;
      --accent: #6ea8ff;
      --danger: #ff5b5b;
      --border: #262b34;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      --toast-bg: rgba(255,255,255,0.9);
      --toast-text: #0f1115;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app {
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
      gap: 12px;
    }
    header.top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      color: var(--text);
      cursor: default;
      position: relative;
    }
    .icon-btn.disabled {
      opacity: 0.6;
    }
    .day-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .day-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select.day-select {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      box-shadow: var(--shadow);
    }
    .date-label {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .status .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #34c759;
    }
    .status.error .dot {
      background: var(--danger);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .control-group {
      background: var(--card);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 120px;
    }
    .control-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.2px;
    }
    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 44px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 6px 14px rgba(0, 122, 255, 0.25);
    }
    .refresh-btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      box-shadow: var(--shadow);
      cursor: pointer;
      min-width: 110px;
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 8px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .pill {
      background: rgba(0, 122, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(0, 122, 255, 0.25);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
    }
    [data-theme="dark"] .pill {
      background: rgba(110, 168, 255, 0.15);
      border-color: rgba(110, 168, 255, 0.35);
    }
    .sets-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .sets-table th, .sets-table td {
      padding: 8px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .sets-table th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.2px;
    }
    .sets-table tr:last-child td {
      border-bottom: none;
    }
    .sets-table tr.last-set {
      background: rgba(0, 122, 255, 0.06);
    }
    [data-theme="dark"] .sets-table tr.last-set {
      background: rgba(110, 168, 255, 0.08);
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }
    .btn {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    .btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(0, 122, 255, 0.25);
    }
    .btn.danger {
      color: var(--danger);
      border-color: rgba(215, 0, 21, 0.3);
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }
    .bottom-bar {
      padding-top: 6px;
    }
    .finish-btn {
      width: 100%;
      padding: 15px 16px;
      font-size: 16px;
      border-radius: 14px;
      border: 1px dashed var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: not-allowed;
      box-shadow: var(--shadow);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(150%);
      background: var(--toast-bg);
      color: var(--toast-text);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      font-size: 14px;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 20;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .full-screen-msg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="not-telegram" class="full-screen-msg" style="display:none">Открой WebApp из Telegram. В браузере авторизация не работает.</div>
  <div id="app" class="app" style="display:none">
    <header class="top-bar">
      <button class="icon-btn disabled" title="Скоро" aria-label="Меню">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect y="0" width="18" height="2.2" rx="1" fill="currentColor"/>
          <rect y="5.9" width="18" height="2.2" rx="1" fill="currentColor"/>
          <rect y="11.8" width="18" height="2.2" rx="1" fill="currentColor"/>
        </svg>
      </button>
      <div class="day-block">
        <div class="day-row">
          <select id="daySelect" class="day-select"></select>
          <div id="status" class="status"><span class="dot"></span><span class="status-text">онлайн</span></div>
        </div>
        <div class="date-label" id="dateLabel">—</div>
      </div>
    </header>

    <div class="controls">
      <div class="control-group">
        <div class="control-label">Шаг веса</div>
        <div class="chip-row" id="weightSteps"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Шаг повт.</div>
        <div class="chip-row" id="repsSteps"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Шаг секунд</div>
        <div class="chip-row" id="secSteps"></div>
      </div>
      <button id="refreshBtn" class="refresh-btn">Обновить</button>
    </div>

    <div id="cards" class="card-list"></div>

    <div class="bottom-bar">
      <button class="finish-btn" disabled title="Скоро">Завершить день</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const state = {
      initData: '',
      dayIndex: null,
      date: '',
      activeDays: [],
      exercises: new Map(),
      steps: {
        weight: 1,
        reps: 1,
        seconds: 5,
      },
      actionQueues: new Map(),
    };

    const tg = window.Telegram ? window.Telegram.WebApp : null;

    function applyTheme() {
      const scheme = tg?.colorScheme;
      const themeParams = tg?.themeParams || {};
      const root = document.documentElement;
      root.dataset.theme = scheme === 'dark' ? 'dark' : 'light';
      const map = {
        '--bg': themeParams.bg_color,
        '--card': themeParams.secondary_bg_color,
        '--text': themeParams.text_color,
        '--muted': themeParams.hint_color,
        '--accent': themeParams.button_color,
        '--toast-bg': scheme === 'dark' ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.85)',
        '--toast-text': scheme === 'dark' ? '#0f1115' : '#fff',
      };
      Object.entries(map).forEach(([key, val]) => {
        if (val) root.style.setProperty(key, val);
      });
    }

    function setVisible(el, flag) {
      el.style.display = flag ? '' : 'none';
    }

    function setStatus(ok) {
      const el = document.getElementById('status');
      const text = el.querySelector('.status-text');
      if (ok) {
        el.classList.remove('error');
        text.textContent = 'онлайн';
      } else {
        el.classList.add('error');
        text.textContent = 'ошибка';
      }
    }

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    async function apiFetch(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (state.initData) {
        headers.set('X-Telegram-InitData', state.initData);
      }
      if (options.body && !(options.body instanceof FormData)) {
        headers.set('Content-Type', 'application/json');
      }
      const res = await fetch(path, { ...options, headers });
      if (!res.ok) {
        setStatus(false);
        const msg = res.status === 401 || res.status === 403
          ? 'Нет доступа'
          : res.status >= 500
            ? 'Сервис недоступен'
            : 'Ошибка связи';
        toast(msg);
        throw new Error('API error: ' + res.status);
      }
      setStatus(true);
      return res.json();
    }

    function renderSteps() {
      const weightSteps = [0.5, 1, 2.5, 5];
      const repsSteps = [1, 2];
      const secSteps = [5, 10, 30];
      const mount = (id, steps, key) => {
        const wrap = document.getElementById(id);
        wrap.innerHTML = '';
        steps.forEach((s) => {
          const btn = document.createElement('button');
          btn.className = 'chip' + (state.steps[key] === s ? ' active' : '');
          btn.textContent = s.toString();
          btn.addEventListener('click', () => {
            state.steps[key] = s;
            renderSteps();
          });
          wrap.appendChild(btn);
        });
      };
      mount('weightSteps', weightSteps, 'weight');
      mount('repsSteps', repsSteps, 'reps');
      mount('secSteps', secSteps, 'seconds');
    }

    function formatWeight(n) {
      if (Number.isInteger(n)) return n.toString();
      return parseFloat(n.toFixed(2)).toString();
    }

    function renderSetsTable(exercise, container) {
      const sets = exercise.sets || [];
      const table = document.createElement('table');
      table.className = 'sets-table';
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>№</th><th>повт.</th><th>сек.</th><th>кг</th></tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      if (!sets.length) {
        const row = document.createElement('tr');
        row.innerHTML = '<td colspan="4" style="color: var(--muted); padding: 12px 6px;">Добавь первый сет</td>';
        tbody.appendChild(row);
      } else {
        sets.forEach((s, idx) => {
          const row = document.createElement('tr');
          if (idx === sets.length - 1) row.classList.add('last-set');
          row.innerHTML = `<td>${s.set_no}</td><td>${s.reps}</td><td>${s.seconds}</td><td>${formatWeight(s.weight_kg)}</td>`;
          tbody.appendChild(row);
        });
      }
      table.appendChild(tbody);
      container.innerHTML = '';
      container.appendChild(table);
    }

    function setExerciseBusy(ueId, isBusy) {
      const card = document.querySelector(`[data-ueid="${ueId}"]`);
      if (!card) return;
      card.querySelectorAll('button.btn').forEach((b) => {
        if (isBusy) {
          b.dataset.prevDisabled = b.disabled ? '1' : '0';
          b.disabled = true;
        } else if (b.dataset.prevDisabled === '0') {
          b.disabled = false;
        }
      });
    }

    function updateActionAvailability(exercise) {
      const card = document.querySelector(`[data-ueid="${exercise.user_exercise_id}"]`);
      if (!card) return;
      const hasSets = (exercise.sets || []).length > 0;
      card.querySelectorAll('[data-need-set]')?.forEach((btn) => {
        btn.disabled = !hasSets;
      });
    }

    function renderExercise(exercise) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.ueid = exercise.user_exercise_id;

      const header = document.createElement('div');
      header.className = 'card-header';
      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = exercise.name;
      header.appendChild(title);
      if (exercise.muscle_group) {
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.textContent = exercise.muscle_group;
        header.appendChild(pill);
      }
      card.appendChild(header);

      const setsWrap = document.createElement('div');
      renderSetsTable(exercise, setsWrap);
      card.appendChild(setsWrap);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const addBtn = document.createElement('button');
      addBtn.className = 'btn primary';
      addBtn.textContent = '＋ сет';
      addBtn.addEventListener('click', () => queueExerciseAction(exercise.user_exercise_id, () => addSet(exercise.user_exercise_id)));
      actions.appendChild(addBtn);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'btn danger';
      removeBtn.textContent = '－ сет';
      removeBtn.dataset.needSet = '1';
      removeBtn.addEventListener('click', () => queueExerciseAction(exercise.user_exercise_id, () => removeSet(exercise.user_exercise_id)));
      actions.appendChild(removeBtn);

      const weightMinus = document.createElement('button');
      weightMinus.className = 'btn';
      weightMinus.textContent = 'кг −';
      weightMinus.dataset.needSet = '1';
      weightMinus.addEventListener('click', () => queueExerciseAction(exercise.user_exercise_id, () => incSet(exercise.user_exercise_id, 'weight_kg', -state.steps.weight)));
      actions.appendChild(weightMinus);

      const weightPlus = document.createElement('button');
      weightPlus.className = 'btn';
      weightPlus.textContent = 'кг +';
      weightPlus.dataset.needSet = '1';
      weightPlus.addEventListener('click', () => queueExerciseAction(exercise.user_exercise_id, () => incSet(exercise.user_exercise_id, 'weight_kg', state.steps.weight)));
      actions.appendChild(weightPlus);

      const repsMinus = document.createElement('button');
      repsMinus.className = 'btn';
      repsMinus.textContent = 'повт −';
      repsMinus.dataset.needSet = '1';
      repsMinus.addEventListener('click', () => queueExerciseAction(exercise.user_exercise_id, () => incSet(exercise.user_exercise_id, 'reps', -state.steps.reps)));
      actions.appendChild(repsMinus);

      const repsPlus = document.createElement('button');
      repsPlus.className = 'btn';
      repsPlus.textContent = 'повт +';
      repsPlus.dataset.needSet = '1';
      repsPlus.addEventListener('click', () => queueExerciseAction(exercise.user_exercise_id, () => incSet(exercise.user_exercise_id, 'reps', state.steps.reps)));
      actions.appendChild(repsPlus);

      const secMinus = document.createElement('button');
      secMinus.className = 'btn';
      secMinus.textContent = 'сек −';
      secMinus.dataset.needSet = '1';
      secMinus.addEventListener('click', () => queueExerciseAction(exercise.user_exercise_id, () => incSet(exercise.user_exercise_id, 'seconds', -state.steps.seconds)));
      actions.appendChild(secMinus);

      const secPlus = document.createElement('button');
      secPlus.className = 'btn';
      secPlus.textContent = 'сек +';
      secPlus.dataset.needSet = '1';
      secPlus.addEventListener('click', () => queueExerciseAction(exercise.user_exercise_id, () => incSet(exercise.user_exercise_id, 'seconds', state.steps.seconds)));
      actions.appendChild(secPlus);

      card.appendChild(actions);
      updateActionAvailability(exercise);
      return card;
    }

    function renderExercises(list) {
      const container = document.getElementById('cards');
      container.innerHTML = '';
      state.exercises = new Map();
      list.forEach((ex) => {
        state.exercises.set(ex.user_exercise_id, ex);
        const card = renderExercise(ex);
        container.appendChild(card);
      });
    }

    function applySetsUpdate(ueId, sets) {
      const exercise = state.exercises.get(ueId);
      if (!exercise) return;
      exercise.sets = sets;
      const card = document.querySelector(`[data-ueid="${ueId}"]`);
      if (!card) return;
      const setsWrap = card.querySelector('.sets-table')?.parentElement;
      if (setsWrap) {
        renderSetsTable(exercise, setsWrap);
      }
      updateActionAvailability(exercise);
    }

    function queueExerciseAction(ueId, actionFn) {
      const last = state.actionQueues.get(ueId) || Promise.resolve();
      const run = async () => {
        setExerciseBusy(ueId, true);
        try {
          await actionFn();
        } finally {
          setExerciseBusy(ueId, false);
        }
      };
      const next = last.then(run, run);
      state.actionQueues.set(ueId, next.catch(() => {}));
      return next;
    }

    async function addSet(ueId) {
      const data = await apiFetch(`/gymapi/day/${state.dayIndex}/exercise/${ueId}/set/add`, {
        method: 'POST',
        body: JSON.stringify({}),
      });
      applySetsUpdate(ueId, data.sets);
      toast('Сохранено');
    }

    async function removeSet(ueId) {
      const data = await apiFetch(`/gymapi/day/${state.dayIndex}/exercise/${ueId}/set/remove_last`, {
        method: 'POST',
        body: JSON.stringify({}),
      });
      applySetsUpdate(ueId, data.sets);
      toast('Сохранено');
    }

    async function incSet(ueId, field, delta) {
      const data = await apiFetch(`/gymapi/day/${state.dayIndex}/exercise/${ueId}/set/inc_last`, {
        method: 'POST',
        body: JSON.stringify({ field, delta }),
      });
      applySetsUpdate(ueId, data.sets);
      toast('Сохранено');
    }

    async function loadSheet(dayIndex) {
      state.dayIndex = dayIndex;
      const sheet = await apiFetch(`/gymapi/day/${dayIndex}/sheet`);
      state.date = sheet.date;
      document.getElementById('dateLabel').textContent = sheet.date;
      renderExercises(sheet.exercises || []);
    }

    async function loadToday() {
      const info = await apiFetch('/gymapi/day/today');
      state.activeDays = info.active_days || [];
      const select = document.getElementById('daySelect');
      select.innerHTML = '';
      state.activeDays.forEach((d) => {
        const opt = document.createElement('option');
        opt.value = d.day_index;
        opt.textContent = d.label;
        select.appendChild(opt);
      });
      const targetDay = info.suggested_day_index || (state.activeDays[0]?.day_index);
      select.value = targetDay;
      document.getElementById('dateLabel').textContent = info.date || '';
      await loadSheet(targetDay);
    }

    function bindEvents() {
      document.getElementById('daySelect').addEventListener('change', (e) => {
        const dayIdx = Number(e.target.value);
        loadSheet(dayIdx).catch(console.error);
      });
      document.getElementById('refreshBtn').addEventListener('click', () => {
        if (state.dayIndex) loadSheet(state.dayIndex).catch(console.error);
      });
    }

    function initTelegram() {
      if (!tg || !tg.initData) {
        setVisible(document.getElementById('not-telegram'), true);
        return false;
      }
      tg.ready();
      tg.expand();
      state.initData = tg.initData;
      applyTheme();
      tg.onEvent?.('themeChanged', applyTheme);
      setVisible(document.getElementById('app'), true);
      return true;
    }

    async function init() {
      const ok = initTelegram();
      if (!ok) return;
      renderSteps();
      bindEvents();
      try {
        await loadToday();
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
